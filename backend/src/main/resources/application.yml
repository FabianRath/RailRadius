server:
  port: 8080
  # Where the client IP for the search rate limit comes from. "none": the connection's address. Behind a reverse
  # proxy set "native" (RAILRADIUS_FORWARD_HEADERS_STRATEGY), or every visitor shares the proxy's budget. Never set it
  # without a proxy that overwrites X-Forwarded-For: clients could then pick any IP
  forward-headers-strategy: ${RAILRADIUS_FORWARD_HEADERS_STRATEGY:none}
  # The browser engine's search.wasm (#12) goes out gzipped: 0.30 instead of 0.86 MB. Only that type, so nothing
  # else changes; the browser data file is gzipped already. The rail tiles (#93) are written uncompressed and shrink
  # to about a third
  compression:
    enabled: true
    mime-types: application/wasm,application/vnd.mapbox-vector-tile

spring:
  application:
    name: railradius-backend
  threads:
    # Tomcat requests and Spring's task executor (used for SSE streams) run on virtual threads
    virtual:
      enabled: true
  web:
    resources:
      # The UI is served at http://localhost:8080/ straight from the repo's frontend/ folder (relative to backend/,
      # where the app is started), so edits show on reload without a rebuild. Override with RAILRADIUS_FRONTEND_DIR.
      static-locations: ${RAILRADIUS_FRONTEND_DIR:file:../frontend/}
      cache:
        cachecontrol:
          # Browsers revalidate on every load, so they never run a stale copy of an edited file
          no-cache: true
  # SMTP server for the feed alert mail (railradius.feeds.alerts). Without a host nothing is mailed. Never set the login
  # here: use the gitignored backend/config/application.yml or env vars (SPRING_MAIL_HOST, SPRING_MAIL_USERNAME,
  # SPRING_MAIL_PASSWORD; for Gmail: host smtp.gmail.com and an app password)
  mail:
    port: 587
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      # Milliseconds; a hanging server must not block the admin panel's test mail for long
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

railradius:
  gtfs:
    directory: ${GTFS_DIRECTORY:./data/gtfs}
    # Whether a start without the binary cache parses the ZIP files (minutes on the full data) or starts empty
    auto-load-from-files: false
    # What the app serves, as primitive arrays (S20): read in well under a second. Written after each load of the
    # zips; a server needs only this file
    store-file: data/gtfs-store.bin
    # stop_times.txt is handed to the graph in batches of this many trips, so big feeds don't hold all of it in memory
    trip-batch-size: 100000

  browser-data:
    # Where the gzipped timetable for browsers (#9) is written after each load; only the newest file is kept
    directory: data/browser-data

  rail-tiles:
    # The rail-only basemap tiles that scripts/rail-tiles.sh builds (#93), served at /tiles/rail/. Without them the
    # map keeps OpenFreeMap's rail layers, which start at z8
    directory: data/rail-tiles

  feeds:
    # Update center: a feed whose last service day, or the last day of one of its main rail operators, is at most
    # this many days away counts as expiring
    expiring-days: 30
    # How often the update center logs missing, expired and expiring feeds (first check right after startup)
    check-interval: PT24H
    # Comma-separated sources that belong in the GTFS directory; one without a zip is listed as MISSING in the
    # update center, ready to download. Empty = every feed in gtfs-feeds.txt
    sources:
    # Download URL of each feed for the update center, one "source;url[;Header: value|…]" per line, # for comments.
    # Kept out of git (backend/config/ is gitignored) so the URLs aren't published; without it nothing can be downloaded
    registry-file: config/gtfs-feeds.txt
    # Credentials that header placeholders in gtfs-feeds.txt refer to, e.g. auth.hungary (base64 of "user:password").
    # Never set them here: use the gitignored backend/config/application.yml or env vars (RAILRADIUS_FEEDS_AUTH_HUNGARY).
    # A feed whose setting is missing is rejected when downloaded.
    alerts:
      # One mail a day (at cron, server time) listing the served feeds whose trains end within this many days or
      # already have. Read from the served store, so it works on a server without zips. Turned on and off, and
      # feeds paused, in the admin panel (Alerts tab); both are kept in settings-file. Off until turned on there
      days: 14
      cron: "0 0 8 * * *"
      settings-file: data/feed-alerts.json
      # Recipient; nothing is mailed while empty. Sender: empty = the SMTP login (spring.mail.username)
      to: ${RAILRADIUS_ALERTS_TO:}
      from: ${RAILRADIUS_ALERTS_FROM:${spring.mail.username:}}

  cache:
    # When a user queries station X with N transfers, search this max in the background; N+1 and up are cut from it
    predictive-enabled: true
    predictive-max-transfers: 5
    # Raw search results kept for cache hits (also for lower transfer counts); Caffeine evicts rarely used ones first.
    # One full-data result maps every reachable station to its paths, so keep this small
    raw-max-entries: 30

  search:
    gate:
      # Searches that run at once. A 5-transfer search on the full data holds about 200 MB while it runs and keeps
      # its scratch for the next search, so this bounds the heap a burst of visitors can take. The predictive warmer only
      # runs when a permit is free
      permits: 2
      # Searches that wait for a permit; the next one is turned away as busy (SSE error event, 503 otherwise)
      max-queued: 6
    # A search running longer than this (ms, not counting its wait for a permit) stops, stores nothing and frees its
    # permit (SSE error event, 503 otherwise): a backstop for parameters the rate limit prices too low. The slowest
    # full-data search measured took 4.5 s with both permits busy, so this is ~6x that (docs/decisions.md). The SSE
    # stream timeout follows from it and the gate: 2.5 x (ceil(max-queued / permits) + 1) x this, 5 min by default
    # (SearchAdmission.longestWait)
    deadline-ms: 30000
    rate-limit:
      # Search budget per client (IPv4 address or IPv6 /64), refilled continuously. A search costs its p50 time on the
      # full data in units of about 100 ms of the engine before S18: 1, 1, 5, 17, 40, 65 for 0..5 transfers at a 180-min
      # max wait at changes, scaled by (max wait + 360) / 540, so 2/3 at 0 min and 4/3 at 360 (1, 1, 7, 23, 53, 87).
      # Must be at least the biggest search's cost (87). A stored result is free, so is an
      # admin (token header or the cookie set at dev login). Over budget: "try again in N s" (SSE error event, 429
      # otherwise)
      capacity: 200
      refill-per-second: 1

  admin:
    # Shared secret for /api/admin/** (sent as X-Admin-Token). Empty = admin API disabled (403), so a deployment
    # without RAILRADIUS_ADMIN_TOKEN never exposes it. The live server sets it (feed alerts are managed in the admin
    # panel, docs/HOSTING.md). Use a long random value, e.g. 32+ random bytes in hex
    token: ${RAILRADIUS_ADMIN_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        # Spring's default too, set explicitly so nothing else (env, beans, heapdump, ...) is opened by accident
        include: health

logging:
  level:
    root: INFO
    com.railradius: INFO
