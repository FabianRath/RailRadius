server:
  port: 8080

spring:
  application:
    name: railreach-backend
  threads:
    # Tomcat requests and Spring's task executor (used for SSE streams) run on virtual threads
    virtual:
      enabled: true
  web:
    resources:
      # The UI is served at http://localhost:8080/ straight from the repo's frontend/ folder (relative to backend/,
      # where the app is started), so edits show on reload without a rebuild. Override with RAILREACH_FRONTEND_DIR.
      static-locations: ${RAILREACH_FRONTEND_DIR:file:../frontend/}
      cache:
        cachecontrol:
          # Browsers revalidate on every load, so they never run a stale copy of an edited file
          no-cache: true

railreach:
  gtfs:
    directory: ${GTFS_DIRECTORY:./data/gtfs}
    # Set to false to load from cache instead of parsing ZIP files on startup
    auto-load-from-files: false
    # Where to store processed GTFS data (stations, graph, connections)
    cache-file: data/gtfs-cache.json
  
  algorithm:
    max-transfer-time-minutes: 180
    cache-size: 10000
    cache-ttl-minutes: 60

  cache:
    # When a user queries station X with N transfers, pre-warm N+1 up to this max in the background
    predictive-enabled: true
    predictive-max-transfers: 5
    # Raw BFS results kept for cache hits and incremental searches; Caffeine evicts rarely used ones first.
    # One full-data result maps every reachable station to its path, so keep this small
    raw-max-entries: 30
  
  # Hub routing configuration
  hub:
    # Set to false to skip auto-computation on startup (recommended for development)
    auto-initialize: false
    
    # Where to store pre-computed hub data
    cache-file: data/hub-cache.json
    
    # Number of hub stations to identify (top N by connectivity)
    # More hubs = faster queries but slower startup and larger cache
    num-hubs: 50
    
    # How many transfers to pre-compute from each hub
    # 1 = direct connections only (fast, good for 2-transfer queries)
    # 2 = covers 3-transfer queries but 10x slower to compute
    precompute-transfers: 1
    
    # Timeout per hub computation (seconds)
    # Increase if hubs are timing out during computation
    timeout-seconds: 600

logging:
  level:
    root: INFO
    com.railreach: INFO
