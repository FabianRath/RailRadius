# Sends the backend's full resolved Maven tree to GitHub's dependency graph, so Dependabot alerts
# also cover what Spring Boot's parent pulls in, not only the dependencies listed in pom.xml.
name: Dependency submission

on:
  push:
    branches: [main]
    paths:
      - backend/pom.xml
      - .github/workflows/dependency-submission.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: advanced-security/maven-dependency-submission-action@v5
        with:
          directory: backend
